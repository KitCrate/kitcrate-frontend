name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, lint, SDK tests, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: SDK tests
        run: npm test --workspace=@kitcrate/sdk

      # A change that typechecks and lints cleanly can still break the
      # actual production build (a static-generation error, a bad
      # next.config.js change, anything build-time-only) -- CI previously
      # never caught that (Phase 1 audit P1-7). No env vars are required:
      # the app degrades gracefully to its unconfigured state (contract
      # writes disabled, listing/agreement reads empty) rather than
      # failing the build when NEXT_PUBLIC_* values are absent.
      - name: Production build
        run: npm run build
